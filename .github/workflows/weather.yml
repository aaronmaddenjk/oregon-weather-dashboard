name: Generate weather dashboard

on:
  schedule:
    # 6:00 AM Pacific ≈ 13:00 UTC (adjust for daylight saving as needed)
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# The site (docs/ - ~2 MB page + ~5 MB of Map-tab frame files) is published straight to
# GitHub Pages rather than committed, so the repo doesn't grow by megabytes a day.
# Only the small verification/ files (SNOTEL calibration, cached station list and land
# mask) are committed. Repo settings -> Pages -> Source must be "GitHub Actions".
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # most requests have no timeout; don't let a hung API burn Actions minutes
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          PYTHONUNBUFFERED: "1"   # stream the build log live
        run: python weather_dashboard.py

      # --- optional: email the result instead of / in addition to Pages ---
      # - name: Email dashboard
      #   env:
      #     RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      #   run: python send_email.py

      - name: Commit verification data
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add verification/
          git diff --quiet --cached || git commit -m "Update verification $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

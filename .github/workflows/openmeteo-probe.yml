# One-off: can GitHub's shared runners reach Open-Meteo reliably? (tools/openmeteo_probe.py)
# Run by hand only; remove after the test.
name: Open-Meteo probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u tools/openmeteo_probe.py

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trail list</title>
<style>
  :root { --ink:#111; --muted:#5A5F6B; --faint:#8A8F9C; --rule:#E4E6EB; --accent:#FE5000; --ok:#2F7A45; --open:#4B2A7A; }
  body { font: 14px system-ui, sans-serif; margin: 24px; color: var(--ink); max-width: 760px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 10px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 90px; padding: 8px 10px; border: 1px solid #C9CDD5; border-radius: 8px; font: 12.5px ui-monospace, Consolas, monospace; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button { padding: 8px 14px; border: 1px solid #C9CDD5; border-radius: 8px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  label.file { color: var(--open); font-weight: 600; cursor: pointer; }
  select { padding: 6px 8px; border: 1px solid #C9CDD5; border-radius: 8px; font: inherit; }
  .sum { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin: 16px 0 8px; font-variant-numeric: tabular-nums; }
  .sum b { color: var(--ink); }
  ol { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 10px; }
  li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--rule); align-items: baseline; }
  li:first-child { border-top: 0; }
  li a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; font-size: 13px; }
  li a:hover { text-decoration: underline; }
  .st { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); }
  .st.saved { color: var(--ok); } .st.opened { color: var(--open); }
  li.saved a { color: var(--faint); }
  .msg { font-size: 13px; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
  <h1>Trail list</h1>
  <p>Paste trail links (one per line, any notepad file) or load a .txt file. <b>Open next</b> opens a batch of the ones you haven't saved yet as background tabs.
    Look at each one and save it with the button or Alt+Shift+S; it turns <b>Saved</b> here. Trails already in your trails are skipped.</p>
  <textarea id="paste" placeholder="https://www.alltrails.com/trail/us/oregon/..."></textarea>
  <div class="row">
    <button id="add">Add these links</button>
    <label class="file"><input id="file" type="file" accept=".txt,text/plain" hidden>Load a .txt file…</label>
    <span class="msg" id="msg"></span>
  </div>
  <div class="row">
    <button class="go" id="next">Open next 10</button>
    <label>Batch <select id="batch"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
    <button id="reset" title="Forget which ones were opened (saved ones stay saved)">Reset opened</button>
    <button id="clear">Clear the list</button>
  </div>
  <div class="sum" id="sum"></div>
  <ol id="list"></ol>
  <script src="list.js"></script>
</body>
</html>
